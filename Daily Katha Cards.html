<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Daily Katha — Card themes for every interest</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Telugu:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  html, body { margin:0; padding:0; background:#1A1410; }
  body { font-family: 'DM Sans', system-ui, sans-serif; color:#fff; }
  *, *::before, *::after { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="themes.jsx"></script>
<script type="text/babel" src="card.jsx"></script>

<script type="text/babel">
const { useState } = React;
const { DesignCanvas, DCSection, DCArtboard } = window;

const GROUPS = [
  { id:'daily', title:'Daily moments', subtitle:'Open the app and feel something — sunrise, a lull, family, or a friend',
    ids:['goodmorning','goodnight','family','friendship'] },
  { id:'devotion', title:'Devotion & festival', subtitle:'Sacred, seasonal, shareable',
    ids:['bhakti','festival'] },
  { id:'inspire', title:'Inspiration & soul', subtitle:'A nudge, a verse, a salute',
    ids:['motivation','heroes','poetry'] },
  { id:'personal', title:'Personal & playful', subtitle:'Cinema lines, love notes, birthdays',
    ids:['love','cinema','birthday'] },
];

const App = () => {
  const themesById = Object.fromEntries(window.THEMES.map(t => [t.id, t]));
  return (
    <DesignCanvas title="Daily Katha — One feed-card per interest" subtitle="12 themed status cards in the home-screen frame, ready to ship as `Your card today` for every interest. Telugu hero · English echo · share-to-status framing.">
      {GROUPS.map(g => (
        <DCSection key={g.id} id={g.id} title={g.title} subtitle={g.subtitle}>
          {g.ids.map(id => {
            const theme = themesById[id];
            return (
              <DCArtboard key={id} id={id} label={`${theme.pill} · ${id}`} width={380} height={780}>
                <HomeScreen theme={theme}/>
              </DCArtboard>
            );
          })}
        </DCSection>
      ))}
    </DesignCanvas>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
