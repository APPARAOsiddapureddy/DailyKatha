name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: dailykatha
          POSTGRES_USER: dailykatha
          POSTGRES_PASSWORD: dailykatha
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dailykatha -d dailykatha"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://dailykatha:dailykatha@localhost:5432/dailykatha
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci_test_jwt_secret
      CORS_WHITELIST: http://localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: backend
        run: npm ci
      - name: DB migrate (v1 API schema)
        working-directory: backend
        run: npm run migrate
      - name: Lint
        working-directory: backend
        run: npm run lint
      - name: Unit tests
        working-directory: backend
        run: npm test
      - name: Integration tests
        working-directory: backend
        run: npm run test:integration
      - name: Build
        working-directory: backend
        run: npm run build
